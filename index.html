<!DOCTYPE html>

<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤ Bahora ❤</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: radial-gradient(circle at center, #18000a, #020008 70%);
    font-family: Arial, sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
}

#heart {
    position: absolute;
    top: 48%;
    left: 50%;
    width: 220px;
    height: 220px;
    background: #ff1744;
    transform: translate(-50%, -50%) rotate(45deg) scale(0);
    opacity: 0;
    box-shadow:
        0 0 20px #ff1744,
        0 0 50px #ff1744,
        0 0 100px #ff4081;
    z-index: 2;
}

#heart::before,
#heart::after {
    content: "";
    position: absolute;
    width: 220px;
    height: 220px;
    background: #ff1744;
    border-radius: 50%;
}

#heart::before {
    top: -110px;
    left: 0;
}

#heart::after {
    top: 0;
    left: -110px;
}

.show-heart {
    animation: heartAppear 2s forwards, heartbeat 1.2s infinite 2s;
}

#letter {
    position: absolute;
    top: 48%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 110px;
    font-weight: bold;
    z-index: 5;
    opacity: 0;
    text-shadow:
        0 0 15px white,
        0 0 30px #ff4081;
}

.show-letter {
    animation: letterAppear 1.5s forwards;
}

#name {
    position: absolute;
    width: 100%;
    bottom: 12%;
    text-align: center;
    color: white;
    font-size: 60px;
    font-weight: bold;
    opacity: 0;
    z-index: 10;
    text-shadow:
        0 0 10px #ff1744,
        0 0 25px #ff1744,
        0 0 60px #ff4081;
}

.show-name {
    animation: nameAppear 2s forwards;
}

@keyframes heartAppear {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(45deg) scale(0);
    }

    70% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(45deg) scale(1.15);
    }

    100% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(45deg) scale(1);
    }
}

@keyframes heartbeat {
    0%, 100% {
        transform: translate(-50%, -50%) rotate(45deg) scale(1);
    }

    50% {
        transform: translate(-50%, -50%) rotate(45deg) scale(1.12);
    }
}

@keyframes letterAppear {
    from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0);
    }

    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

@keyframes nameAppear {
    from {
        opacity: 0;
        transform: translateY(50px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 600px) {
    #heart {
        width: 150px;
        height: 150px;
    }

    #heart::before,
    #heart::after {
        width: 150px;
        height: 150px;
    }

    #heart::before {
        top: -75px;
    }

    #heart::after {
        left: -75px;
    }

    #letter {
        font-size: 75px;
    }

    #name {
        font-size: 38px;
    }
}
</style>

</head>

<body>

<canvas id="canvas"></canvas>

<div id="heart"></div>
<div id="letter">B</div>
<div id="name">❤ Bahora ❤</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

let particles = [];

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 2;

        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.life = 100;
        this.size = Math.random() * 3 + 1;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;

        this.vy += 0.03;

        this.vx *= 0.98;
        this.vy *= 0.98;

        this.life--;
    }

    draw() {
        ctx.beginPath();

        ctx.globalAlpha = this.life / 100;
        ctx.fillStyle = this.color;

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function firework() {

    const x =
        Math.random() * canvas.width * 0.8 +
        canvas.width * 0.1;

    const y =
        Math.random() * canvas.height * 0.45 +
        canvas.height * 0.05;

    const colors = [
        "#ff1744",
        "#ffeb3b",
        "#00e5ff",
        "#76ff03",
        "#e040fb",
        "#ffffff"
    ];

    const color =
        colors[Math.floor(Math.random() * colors.length)];

    for (let i = 0; i < 150; i++) {
        particles.push(
            new Particle(x, y, color)
        );
    }
}

function animate() {

    ctx.fillStyle = "rgba(2,0,8,0.20)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.update();
        p.draw();

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }

    requestAnimationFrame(animate);
}

animate();

/* 🎆 SALYUTLAR */

let fireworksCount = 0;

const fireworks = setInterval(() => {

    firework();

    fireworksCount++;

    if (fireworksCount >= 8) {
        clearInterval(fireworks);
    }

}, 650);


/* ❤️ YURAK PAYDO BO'LADI */

setTimeout(() => {

    document
        .getElementById("heart")
        .classList
        .add("show-heart");

}, 5500);


/* 🔤 B HARFI */

setTimeout(() => {

    document
        .getElementById("letter")
        .classList
        .add("show-letter");

}, 6500);


/* ❤ BAHORA ❤ */

setTimeout(() => {

    document
        .getElementById("name")
        .classList
        .add("show-name");

}, 8000);

</script>

</body>
</html>
